name: Update results

on:
  schedule:
    # Times are UTC. Pacific is UTC-8 after daylight saving ends on Nov 1.
    # Election night, Tue Nov 3 7:57 PM to Wed Nov 4 4:57 AM Pacific: every 5 minutes.
    - cron: "57 3 4 11 *"
    - cron: "2-57/5 4-12 4 11 *"
    # Thu Nov 5 to Mon Nov 16, 8:04 AM to 5:54 PM Pacific: every 10 minutes.
    - cron: "4-54/10 16-23 5-16 11 *"
    - cron: "4-54/10 0-1 6-17 11 *"
    # Between those windows, one read an hour (Wed Nov 4 5:07 AM to Tue Nov 17 7:07 AM), then one
    # a day at 5:07 PM until Thu Dec 3: a site status set by the last reads of a window clears by
    # itself, and a county update posted outside the windows still reaches the page.
    - cron: "7 13-23 4 11 *"
    - cron: "7 0-15 5 11 *"
    - cron: "7 2-15 6-17 11 *"
    - cron: "7 1 18-30 11 *"
    - cron: "7 1 1-4 12 *"
  workflow_dispatch:
    inputs:
      yes:
        description: "Manual entry: YES total. Leave all three blank to read the county page."
        required: false
        type: string
      no:
        description: "Manual entry: NO total"
        required: false
        type: string
      county_updated:
        description: "Manual entry: the county page's Website Updated time, e.g. 11/3/2026 8:10:45 PM (required)"
        required: false
        type: string
      allow_decrease:
        description: "Accept YES or NO going down, for this run only (a county correction or fixing a typo)"
        required: false
        type: boolean
        default: false
      certified:
        description: "The county has certified the count (Dec 3 or later): mark the results final"
        required: false
        type: boolean
        default: false
      keepalive:
        description: "Republish only if the live page is behind (the keep-alive and the watchdog's late-read restarts tick this)"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - index.html
      - forecast.html
      - js/**
      - config.json
      - data/**
      - .github/workflows/update.yml

concurrency:
  group: update
  cancel-in-progress: false

env:
  PAGE_URL: https://pleaseruiz.github.io/measure-y-watch

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    outputs:
      deploy: ${{ steps.upload.outcome == 'success' }}
    steps:
      # main as it is now, not the commit this run was queued with: a run that waited in line
      # behind another must not publish data older than what that run just published.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # .last-fetch: when the county was last read (the gap guard).
      # .county-state.json: which county feed to read next, and failed reads in a row (scraper/update.py).
      - name: Restore last county fetch time
        id: cache
        if: github.event_name != 'push'
        uses: actions/cache/restore@v4
        with:
          path: |
            .last-fetch
            .county-state.json
          key: last-fetch-${{ github.run_id }}
          restore-keys: last-fetch-

      # A cache restores only with the path list it was saved with, so caches saved before
      # .county-state.json existed (.last-fetch alone) need their own step.
      - name: Restore last county fetch time (older cache)
        id: cache_old
        if: github.event_name != 'push' && steps.cache.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v4
        with:
          path: .last-fetch
          key: last-fetch-${{ github.run_id }}
          restore-keys: last-fetch-

      - name: Read results
        id: read
        env:
          EVENT: ${{ github.event_name }}
          MANUAL_YES: ${{ inputs.yes }}
          MANUAL_NO: ${{ inputs.no }}
          MANUAL_COUNTY_UPDATED: ${{ inputs.county_updated }}
          ALLOW_DECREASE: ${{ inputs.allow_decrease }}
          MARK_CERTIFIED: ${{ inputs.certified }}
          # Runs the keep-alive or the watchdog start skip the county read when the cache missed.
          KEEPALIVE: ${{ inputs.keepalive }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-matched-key != '' || steps.cache_old.outputs.cache-matched-key != '' }}
        run: python scraper/update.py

      - name: Save last county fetch time
        if: always() && github.event_name != 'push' && hashFiles('.last-fetch', '.county-state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            .last-fetch
            .county-state.json
          key: last-fetch-${{ github.run_id }}

      # Status issues are FYI notes for the owner (ops/status.py). They never fail the run, and
      # they run even when Read results failed. Push events never post them. STATUS_QUICK keeps a
      # slow GitHub API from holding up the publish: each call gets one short try.
      - name: Post an FYI issue that the county can't be read
        if: always() && github.event_name != 'push' && steps.read.outputs.alert == 'now' && steps.read.outputs.failure == 'read'
        continue-on-error: true
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_QUICK: "1"
        run: |
          if [ ! -s diagnosis.md ]; then
            echo "Update results couldn't read the county's results. The run log has the details." > diagnosis.md
          fi
          python ops/status.py open update-failed diagnosis.md

      # A failure outside a county read: a repository file, a manual entry or a bug (or Read results
      # stopped before saying what failed).
      - name: Post an FYI issue that the run failed
        if: always() && github.event_name != 'push' && steps.read.outcome == 'failure' && steps.read.outputs.failure != 'read'
        continue-on-error: true
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_QUICK: "1"
        run: |
          if [ ! -s diagnosis.md ]; then
            echo "Update results failed before it could say why. The run log has the details." > diagnosis.md
          fi
          python ops/status.py open run-failed diagnosis.md

      - name: Close the run-failed FYI issue after a run that works
        if: always() && github.event_name != 'push' && steps.read.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_QUICK: "1"
        run: python ops/status.py resolve run-failed "Update results ran again without a problem."

      # Only a county read closes it: a manual entry doesn't show that the county reads again.
      - name: Close the FYI issue after a good county read
        if: always() && github.event_name != 'push' && steps.read.outputs.read == 'ok' && steps.read.outputs.feed != 'manual'
        continue-on-error: true
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_QUICK: "1"
          FEED: ${{ steps.read.outputs.feed }}
        run: |
          case "$FEED" in
            html) from="the county results page" ;;
            xml) from="the county's backup data feed" ;;
            *) from="the county" ;;
          esac
          python ops/status.py resolve update-failed "The county's results were read again, from $from."

      # data/status.json changes without results.json when a read fails or a county decrease waits to
      # be confirmed, so this also runs after a failed read.
      - name: Commit results.json and status.json
        id: commit
        if: ${{ !cancelled() && (steps.read.outputs.changed == 'true' || steps.read.outputs.status_changed == 'true') }}
        env:
          MESSAGE: ${{ steps.read.outputs.message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.json
          if [ -f data/status.json ]; then git add data/status.json; fi
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -q -m "${MESSAGE:-Update the site status (data/status.json)}"
          git push -q || { git pull -q --rebase origin main && git push -q; }
          echo "Committed"

      - name: Check the forecast engine on the saved results
        if: ${{ !cancelled() && github.event_name != 'push' && steps.commit.outcome == 'success' && steps.read.outputs.changed == 'true' }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_QUICK: "1"
        run: python ops/engine_alert.py data/results.json

      - name: Check whether the live page is behind
        id: live
        if: ${{ !cancelled() && github.event_name != 'push' && steps.commit.outcome != 'failure' }}
        env:
          KEEPALIVE: ${{ inputs.keepalive }}
        run: |
          # A hand-started run always republishes, so it can also repair a failed deploy.
          # Runs the keep-alive and the watchdog's late-read restarts start (keepalive ticked) republish
          # only when behind; the watchdog's republish runs leave it unticked, so they always republish.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$KEEPALIVE" != "true" ]; then
            echo "Hand-started run; deploying"
            echo "behind=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Behind when the live results.json or status.json differs from this run's copy.
          # Without a status.json here, a live page without one (404) is up to date.
          behind=false
          for f in results.json status.json; do
            code=$(curl -sL --max-time 20 -o "live-$f" -w '%{http_code}' "$PAGE_URL/data/$f?t=$(date +%s%N)" || true)
            if [ -f "data/$f" ]; then
              if [ "$code" = "200" ] && cmp -s "live-$f" "data/$f"; then continue; fi
            elif [ "$code" = "404" ]; then
              continue
            fi
            echo "Live data/$f differs (HTTP $code)"
            behind=true
          done
          if [ "$behind" = "true" ]; then
            echo "Live page is behind; deploying"
            echo "behind=true" >> "$GITHUB_OUTPUT"
          else
            echo "Live page is up to date"
          fi

      # After a failed read too, so a changed status.json reaches the page. Not after a failed
      # commit: the page would show data that isn't on main.
      - name: Build site
        if: ${{ !cancelled() && steps.commit.outcome != 'failure' && (steps.live.outputs.behind == 'true' || (github.event_name == 'push' && steps.read.outcome == 'success')) }}
        run: |
          mkdir _site
          cp index.html _site/
          cp -r data _site/
          # The forecast tab is optional: the live count still publishes if it's removed.
          for f in forecast.html js; do if [ -e "$f" ]; then cp -r "$f" _site/; fi; done

      - name: Upload site
        id: upload
        if: ${{ !cancelled() && steps.commit.outcome != 'failure' && (steps.live.outputs.behind == 'true' || (github.event_name == 'push' && steps.read.outcome == 'success')) }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    # Also after a failed read: the update job then fails, but a new status.json must still go out.
    if: ${{ !cancelled() && needs.update.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
